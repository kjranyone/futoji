name: mymusicbook
description: 音楽教室の紙資料をスキャンして整理・閲覧するアプリ
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.0 <2.0.0'
  image: '>=4.2.0 <4.5.0'
  flutter_image_compress: '>=2.0.0 <4.0.0'
  path_provider: '>=2.1.0 <4.0.0'
  hive_ce: '>=2.6.0 <4.0.0'
  hive_ce_flutter: '>=2.0.0 <4.0.0'
  provider: '>=6.1.0 <8.0.0'
  permission_handler: '>=11.0.0 <14.0.0'
  pdf: ">=3.10.0 <4.0.0"
  share_plus: ">=10.0.0 <14.0.0"
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <8.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/models/

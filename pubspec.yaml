name: futoji
description: 音楽教室の紙資料をスキャンして整理・閲覧するアプリ
publish_to: 'none'
version: 1.0.7+5007

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.0 <2.0.0'
  image: '>=4.2.0 <4.5.0'
  flutter_image_compress: '>=2.0.0 <4.0.0'
  path_provider: '>=2.1.0 <4.0.0'
  hive_ce: '>=2.6.0 <4.0.0'
  hive_ce_flutter: '>=2.0.0 <4.0.0'
  provider: '>=6.1.0 <8.0.0'
  permission_handler: '>=11.0.0 <14.0.0'
  pdf: ">=3.10.0 <4.0.0"
  share_plus: ">=10.0.0 <14.0.0"
  ffi: ^2.1.0
  archive: ">=4.0.0 <5.0.0"
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <8.0.0'
  # テストで path_provider を一時ディレクトリに差し替えるため (既存の推移的依存と同じ版)
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/branding/about_icon.png
    # 「このアプリについて」で全文を表示する (公開 URL と同じ文面)
    - docs/PRIVACY_POLICY.md
